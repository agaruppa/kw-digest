name: hourly-digest

on:
  schedule:
    # GitHub silently drops most hourly slots, so knock every 15 minutes;
    # build.py publishes only when new items exist, an empty pass costs nothing.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore quiet hours"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build issue
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python3 build.py --force
          else
            python3 build.py
          fi

      - name: Publish
        run: |
          touch .nojekyll
          git config user.name "kw-digest bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A feed.rss index.html d state .nojekyll
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "digest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Monthly history squash
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "not the 1st - skipping"
            exit 0
          fi
          n=$(git rev-list --count HEAD)
          if [ "$n" -lt 400 ]; then
            echo "$n commits - history still readable, skipping"
            exit 0
          fi
          git checkout -q --orphan squashed
          git add -A
          git commit -qm "squash history ($n commits) $(date -u +%Y-%m-%d)"
          git branch -q -M squashed main
          git push -q -f origin main
          echo "squashed $n commits into one"

